# sealed-secrets.yaml — the controller that lets encrypted secrets live in git.
#
# THE PROBLEM IT SOLVES:
#
# Every other piece of desired state in this repo is safe to publish — manifests,
# values, image tags. The database password was the one exception, and it sat in
# `values.yaml` in plaintext, in a public repo. GitOps says "git is the source of
# truth", which is awkward when one piece of the truth can't be written down.
#
# Sealed Secrets fixes the asymmetry with public-key crypto. The controller
# generates a keypair and keeps the private half in the cluster. `kubeseal`
# encrypts a Secret with the PUBLIC half, producing a SealedSecret — ciphertext
# that is useless to anyone reading the repo. The controller watches for
# SealedSecrets and decrypts each one into a real Secret, in-cluster.
#
# So the flow inverts: instead of a human pushing a secret into the cluster out
# of band, the cluster PULLS ciphertext from git and unseals it itself. That's
# the same pull model as the rest of Phase 4, now extended to the one thing that
# previously had to be handled by hand.
#
# WHY A VENDORED MANIFEST, NOT A HELM REPO:
#
# The other platform add-ons (kube-prometheus-stack, metrics-server) come from
# upstream Helm repos. Sealed Secrets can't: its chart repo at
# bitnami-labs.github.io/sealed-secrets now returns 404, and the chart has moved
# to an OCI registry under Bitnami's reorganised distribution.
#
# Rather than depend on that, the upstream release manifest is vendored at
# k8s/sealed-secrets/controller.yaml — the same treatment k8s/ingress-nginx/ gets,
# and appropriate for a component that holds a decryption key: the exact bytes
# being applied are committed and reviewable, and the install can't change
# underneath us because someone re-tagged something.
#
# Pinned to v0.39.1 to match the `kubeseal` CLI (brew). The CLI and the
# controller share a crypto format, so they are upgraded together, deliberately.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sealed-secrets
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    # Wave -2: earlier than metrics-server (-1) and well before the app (0).
    # The controller must be running before the app's SealedSecret syncs, or
    # there is nothing to decrypt it and the app's pods wait on a Secret that
    # doesn't exist yet. (It self-corrects once the controller starts — the wave
    # just makes the ordering deterministic instead of a race.)
    argocd.argoproj.io/sync-wave: "-2"
spec:
  # The controller installs a CRD, a ClusterRole and a ClusterRoleBinding, so it
  # needs the `platform` project's broader permissions — the app project
  # deliberately can't create cluster-scoped objects.
  project: platform

  source:
    repoURL: https://github.com/genkuroo/url-shortener-k8s.git
    targetRevision: main
    path: k8s/sealed-secrets

  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
