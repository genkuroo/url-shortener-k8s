# values-dev.yaml — the "dev" environment overlay.
#
# Layered on top of values.yaml with:
#   helm install dev charts/url-shortener -n url-shortener-dev -f values-dev.yaml
# Only the fields that differ from the defaults appear here. Dev is deliberately
# small: a single app replica, no resource caps, its own hostname and a smaller
# database volume — cheap and fast to spin up.
app:
  replicas: 1
postgres:
  storage: 512Mi
ingress:
  host: dev.urlshortener.localtest.me
# Scrape dev too, so the dashboard's namespace switcher has a dev option. The
# dashboard ConfigMap itself is shipped by prod only (see values-prod.yaml).
serviceMonitor:
  enabled: true
image:
  repository: ghcr.io/genkuroo/url-shortener
  tag: 524b4ec
  pullPolicy: IfNotPresent
# --- Sealed database password -------------------------------------------------
# The real dev password, encrypted with the sealed-secrets controller's public
# key. Safe to commit: only the controller's private key — which never leaves the
# cluster — can decrypt it.
#
# Sealed for namespace url-shortener-dev and secret name dev-url-shortener-secret
# specifically (the default `strict` scope), so this string will NOT decrypt in
# any other namespace or under any other name. Regenerate with:
#
#   make seal-password RELEASE=dev NAMESPACE=url-shortener-dev
#
# See docs/SECRETS.md for rotation and for what to do when the cluster is rebuilt.
sealedSecret:
  enabled: true
  encryptedPassword: ""
