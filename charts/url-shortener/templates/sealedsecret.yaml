{{- if .Values.sealedSecret.enabled }}
# SealedSecret — the database password, encrypted, safe to commit.
#
# HOW IT WORKS: `kubeseal` encrypts the value with the controller's PUBLIC key,
# producing the ciphertext below. Only the controller — which holds the private
# key inside the cluster — can decrypt it. It watches for SealedSecret objects
# and unseals each one into a normal Secret with the name given under `template`.
#
# Nothing else in the chart changes. app.yaml and postgres.yaml still read a
# Secret named <fullname>-secret via secretKeyRef; they neither know nor care
# that a controller created it rather than Helm. That's the whole trick — the
# consumers are untouched, only the delivery mechanism moved.
#
# ⚠️ THE CIPHERTEXT IS BOUND TO A NAMESPACE *AND* A NAME.
#
# Default sealing scope is `strict`: the namespace and secret name are folded
# into the encryption. Ciphertext sealed for dev-url-shortener-secret in
# url-shortener-dev will NOT decrypt as prod-url-shortener-secret in
# url-shortener-prod — the controller simply refuses it. That is a feature (it
# stops someone copying your sealed prod credential into a namespace they can
# read), and it's why every environment overlay carries its own encryptedPassword
# rather than sharing one.
#
# ⚠️ IT IS ALSO BOUND TO ONE CLUSTER'S KEYPAIR. A fresh controller generates a
# fresh key, so these values are meaningless to any other cluster unless that
# cluster's key is restored from a backup. See docs/SECRETS.md — this is the
# single most important operational fact about Sealed Secrets.
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: {{ include "url-shortener.fullname" . }}-secret
  labels:
    {{- include "url-shortener.labels" . | nindent 4 }}
spec:
  encryptedData:
    POSTGRES_PASSWORD: {{ required "sealedSecret.enabled is on, so sealedSecret.encryptedPassword must be set — run `make seal-password RELEASE=... NAMESPACE=...`" .Values.sealedSecret.encryptedPassword | quote }}
  # The controller builds the unsealed Secret from this template, so it carries
  # the same name, labels and type the chart's plaintext Secret would have had.
  template:
    metadata:
      name: {{ include "url-shortener.fullname" . }}-secret
      labels:
        {{- include "url-shortener.labels" . | nindent 8 }}
    type: Opaque
{{- end }}
